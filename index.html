<script>
  // List all your SPA routes here
  const routes = ["/", "/react-debug-guide"];

  const path = window.location.pathname;

  // If user navigates directly to a route without #, redirect to hash route
  if (!window.location.hash && routes.includes(path)) {
    window.location.replace(`#${path}`);
  }
</script>

    <!-- Prevent theme flash before React mounts -->
    <script>
      (() => {
        const saved = localStorage.getItem("theme");
        const prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
